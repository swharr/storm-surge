# KEDA Integration for Storm-Surge
# Feature Flag-Driven Autoscaling
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - keda-install.yaml
  - scaled-objects.yaml
  - external-scaler-service.yaml

commonLabels:
  keda.storm-surge.io/managed: "true"
  storm-surge.io/component: "keda"

# Note: KEDA annotations for shopping-cart/product-catalog are applied via
# manifests/base/patches/deployment-annotations.yaml (those Deployments live there)
